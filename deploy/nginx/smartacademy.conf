# /etc/nginx/sites-available/smartacademy — docs/DEPLOY.md, 12-qadam.
# <domen> ni almashtiring. HTTPS (443) qismini `certbot --nginx` o'zi qo'shadi.
server {
    listen 80;
    listen [::]:80;
    server_name <domen>;

    # Skan PDF'lari 80 MB gacha — checker/config.py dagi CHECKER_MAX_UPLOAD_MB bilan bir xil.
    client_max_body_size 80m;

    # Savol rasmlari ish vaqtida public/uploads ga yoziladi. Ularni Node emas, nginx
    # beradi: keshlanadi (Next public fayllarini max-age=0 bilan beradi) va sayt
    # jarayoni qayta ishga tushayotganda ham ochiladi.
    location /uploads/ {
        alias /opt/smartacademy/public/uploads/;
        access_log off;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Javob varaqlari PDF'i va katta skanni tekshirish vaqt oladi.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
